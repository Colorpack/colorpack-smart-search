PLG_SYSTEM_SMARTSEARCHBRIDGE="System - Colorpack Smart Search bridge"
PLG_SYSTEM_SMARTSEARCHBRIDGE_XML_DESCRIPTION="Sends searches made through Joomla's own Smart Search (com_finder) to the Colorpack Smart Search page. Use it when a search box (for example the YOOtheme header search) is tied to com_finder. Installed switched off: enable it when you are ready. / ส่งการค้นหาที่ผ่าน Smart Search เดิมของ Joomla (com_finder) มายังหน้าค้นหาของ Colorpack Smart Search ใช้เมื่อช่องค้นหา (เช่นช่องค้นหาส่วนหัวของ YOOtheme) ผูกอยู่กับ com_finder ติดตั้งแล้วยังปิดอยู่ เปิดเมื่อพร้อม"
