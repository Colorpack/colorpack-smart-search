COM_AISEARCH="Colorpack Smart Search"
COM_AISEARCH_CONFIG_SEARCH="Search"
COM_AISEARCH_CONFIG_RESULTS="Results per page"
COM_AISEARCH_CONFIG_RESULTS_DESC="Page size. Pagination appears when there are more results than this."
COM_AISEARCH_CONFIG_MAXRESULTS="Maximum results per search"
COM_AISEARCH_CONFIG_MAXRESULTS_DESC="The longest list a search can return. With the precision mode on, every article that really matches is shown and this limit does not cut the list; it only matters when the precision mode is off, where weak matches are used to fill the list."
COM_AISEARCH_CONFIG_SYNONYMS="Synonyms"
COM_AISEARCH_CONFIG_SYNONYMS_DESC="Synonym rules are managed on their own page: open the component dashboard, then Improve results > Synonyms."
COM_AISEARCH_CONFIG_APPEARANCE="Appearance"
COM_AISEARCH_CONFIG_TPLMODE="Markup style"
COM_AISEARCH_CONFIG_TPLMODE_DESC="Auto uses YOOtheme / UIkit markup for YOOtheme, Bootstrap 5 markup for Joomla's Cassiopeia template (and templates built on it), otherwise plain styled markup."
COM_AISEARCH_TPLMODE_AUTO="Auto (detect template)"
COM_AISEARCH_TPLMODE_YOO="YOOtheme / UIkit"
COM_AISEARCH_TPLMODE_BS="Bootstrap 5 (Joomla / Cassiopeia)"
COM_AISEARCH_TPLMODE_PLAIN="Plain (own styles)"
COM_AISEARCH_CONFIG_COLUMNS="Card columns (desktop)"
COM_AISEARCH_CONFIG_CARD_W="Card image ratio: width"
COM_AISEARCH_CONFIG_CARD_H="Card image ratio: height"
COM_AISEARCH_CONFIG_CARD_DESC="Only the ratio matters (e.g. 1200 x 630 or 4 x 3). Images are cropped to fit."
COM_AISEARCH_CONFIG_LIST_W="List thumbnail width (px)"
COM_AISEARCH_CONFIG_LIST_H="List thumbnail height (px)"
COM_AISEARCH_CONFIG_IMGSIZE="Image file size"
COM_AISEARCH_CONFIG_IMGSIZE_DESC="Which stored FlexiContent size to load. Smaller files load faster."
COM_AISEARCH_IMGSIZE_L="Large (l_)"
COM_AISEARCH_IMGSIZE_M="Medium (m_)"
COM_AISEARCH_IMGSIZE_S="Small (s_)"
COM_AISEARCH_CONFIG_EXCERPT="Excerpt length (characters)"
COM_AISEARCH_CONFIG_SHOWCAT="Show category"
COM_AISEARCH_CONFIG_SHOWDATE="Show date"
COM_AISEARCH_CONFIG_FCFIELD="FlexiContent image field ID"
COM_AISEARCH_CONFIG_FCFIELD_DESC="Set 0 to ignore FlexiContent. Otherwise images come from this field, then the article intro/full-text image, then the first image in the text. Rebuild the index after changing."
COM_AISEARCH_CONFIG_SHOWPH="Show placeholder when no image"
COM_AISEARCH_CONFIG_PH="Placeholder image path"
COM_AISEARCH_CONFIG_SEARCHW="Search box width (px)"
COM_AISEARCH_CONFIG_SEARCHW_DESC="The search box is centred on the page. Enter 0 for full width."
COM_AISEARCH_CONFIG_SEARCHSTYLE="Search box style"
COM_AISEARCH_SEARCHSTYLE_PRETTY="Rounded box with coloured button"
COM_AISEARCH_SEARCHSTYLE_THEME="Theme style (YOOtheme / UIkit search with icon)"
COM_AISEARCH_CONFIG_BRAND="Accent colour"
COM_AISEARCH_CONFIG_BRAND_DESC="Used for the search button and, in plain markup, the category tags and page numbers."
COM_AISEARCH_CONFIG_SHOWHEADER="Show page header"
COM_AISEARCH_CONFIG_HTITLE="Header title"
COM_AISEARCH_CONFIG_HTEXT="Header text (under the title)"
COM_AISEARCH_CONFIG_PHTEXT="Search box placeholder"
COM_AISEARCH_CONFIG_EXAMPLES="Manual suggestions"
COM_AISEARCH_CONFIG_EXAMPLES_DESC="One search per line (up to 12). Shown when "Manual" is selected, or as a fallback in Automatic mode while there are not yet enough popular searches."
COM_AISEARCH_CONFIG_POPMODE="Suggestions under the search box"
COM_AISEARCH_CONFIG_POPMODE_DESC="Automatic shows the most popular searches, taken from the real search history. Searches with no result and anything that looks like an email, phone number or link are never shown."
COM_AISEARCH_POPMODE_AUTO="Popular searches (automatic)"
COM_AISEARCH_POPMODE_MANUAL="My own list only"
COM_AISEARCH_POPMODE_OFF="None"
COM_AISEARCH_CONFIG_POPCOUNT="How many to show"
COM_AISEARCH_CONFIG_POPDAYS="Look back (days)"
COM_AISEARCH_CONFIG_POPMIN="Minimum number of searches"
COM_AISEARCH_CONFIG_POPMIN_DESC="A search must have been made at least this many times to be listed. Raise it to keep one-off or unusual searches out."
COM_AISEARCH_CONFIG_IMGSRC="Image source"
COM_AISEARCH_CONFIG_IMGSRC_DESC="Where each result's picture comes from. Automatic tries, in order: Intro Image, Full Article Image, the first image inside the article text, then the FlexiContent field. The choice is stored when the index is built: rebuild the index after changing it."
COM_AISEARCH_IMGSRC_AUTO="Automatic (Intro Image, then others)"
COM_AISEARCH_IMGSRC_INTRO="Intro Image (Images and Links tab)"
COM_AISEARCH_IMGSRC_FULL="Full Article Image (Images and Links tab)"
COM_AISEARCH_IMGSRC_TEXT="First image inside the article text"
COM_AISEARCH_IMGSRC_FC="FlexiContent image field"
COM_AISEARCH_CONFIG_TINT="Soft pink panel background"
COM_AISEARCH_CONFIG_TINT_DESC="Wraps the search box and results of the List view in a light tinted panel."
COM_AISEARCH_CONFIG_BADGE="Header badge (optional)"
COM_AISEARCH_CONFIG_BADGE_DESC="A small label above the title, e.g. an announcement. Leave empty for none."
COM_AISEARCH_CONFIG_EQUAL="Equal-size cards"
COM_AISEARCH_CONFIG_EQUAL_DESC="Titles are limited to 2 lines and excerpts to 3 lines so every card has the same layout and height (long text ends with ...)."
COM_AISEARCH_CONFIG_IMGFALLBACK="If the chosen source is empty, try the others"
COM_AISEARCH_CONFIG_IMGFALLBACK_DESC="Recommended. When off, articles without a picture in the chosen source show the placeholder image."
COM_AISEARCH_CONFIG_FONT="Font"
COM_AISEARCH_CONFIG_FONT_DESC="Default = Noto Sans Thai (loaded from Google Fonts). Template = use the website template's own font and text size. The named fonts are also loaded from Google Fonts, which sends visitors' requests to Google."
COM_AISEARCH_FONT_DEMO="Default (Noto Sans Thai)"
COM_AISEARCH_FONT_TEMPLATE="From the template (site font and size)"
COM_AISEARCH_FONT_CUSTOM="Custom font name (already on the site)"
COM_AISEARCH_CONFIG_FONTCUSTOM="Custom font-family"
COM_AISEARCH_CONFIG_FONTCUSTOM_DESC="A CSS font-family that is already loaded by your site, e.g. 'Prompt', sans-serif. Letters, digits, spaces, commas, quotes, hyphens and underscores only."
COM_AISEARCH_CONFIG_FONTSCALE="Text size (%)"
COM_AISEARCH_CONFIG_FONTSCALE_DESC="100 = the standard size. 80 to 130."
COM_AISEARCH_CONFIG_MAXTAGS="Tags shown in the list"
COM_AISEARCH_CONFIG_MAXTAGS_DESC="How many of each article's tags appear as pink labels in the list views (0 = none, up to 10). Tags are stored when the index is built."
COM_AISEARCH_CONFIG_CARDFOOTER="Cards: pink labels at the bottom"
COM_AISEARCH_FOOTER_CAT="Category only"
COM_AISEARCH_FOOTER_TAGS="Tags only"
COM_AISEARCH_FOOTER_BOTH="Category and tags"
COM_AISEARCH_CONFIG_CARDTAGS="Tags shown on a card"
COM_AISEARCH_CONFIG_LISTIMG="List: show a thumbnail"
COM_AISEARCH_CONFIG_LISTIMG_DESC="Adds a small picture to each item of the List view. Its size is set below. Pictures come from the Image source option."
COM_AISEARCH_CONFIG_DISPLAY="How results are displayed"
COM_AISEARCH_CONFIG_DISPLAY_DESC="Choose a single layout, or offer both with a List / Cards switch above the results (the visitor's choice is remembered in a cookie)."
COM_AISEARCH_DISPLAY_BOTH_LIST="Both - switch available, List shown first"
COM_AISEARCH_DISPLAY_BOTH_CARD="Both - switch available, Cards shown first"
COM_AISEARCH_DISPLAY_LIST="List only (no switch)"
COM_AISEARCH_DISPLAY_CARD="Cards only (no switch)"
COM_AISEARCH_CONFIG_PRECISION="Precision mode"
COM_AISEARCH_CONFIG_PRECISION_DESC="Show only the articles that answer the search directly, not every article that happens to contain one of the words. A number with a unit (for example 1 month) must appear together in the text. Articles are ordered by how direct the match is: title first, then tags and category, then text. Test it with Compare search modes on the dashboard before switching it on."
COM_AISEARCH_CONFIG_PREC_TIER="Show matches down to"
COM_AISEARCH_CONFIG_PREC_TIER_DESC="Title, tags and category only is the strictest. The default also shows articles that discuss the topic in the text."
COM_AISEARCH_PREC_TIER_2="Title, tags and category only"
COM_AISEARCH_PREC_TIER_3="Also articles that discuss it in the text (recommended)"
COM_AISEARCH_PREC_TIER_4="Also weak matches (most words, or only mentioned)"
COM_AISEARCH_CONFIG_PREC_COMMON="Common word share (%)"
COM_AISEARCH_CONFIG_PREC_COMMON_DESC="A word found in at least this share of all articles is treated as background (for example child) and only breaks ties. The other words must be present."
COM_AISEARCH_CONFIG_CLICKS="Learn from clicks"
COM_AISEARCH_CONFIG_CLICKS_DESC="When several visitors who searched for the same words open the same article, that article is moved up for that search. Only the search text and the article number are kept, with a count; no visitor information."
COM_AISEARCH_CONFIG_CLICKMIN="Clicks needed before it counts"
COM_AISEARCH_CONFIG_CLICKMIN_DESC="An article is moved up for a search only after this many clicks on it. A higher number is safer on a busy site."
COM_AISEARCH_CONFIG_LOGDAYS="Keep the search log for (days)"
COM_AISEARCH_CONFIG_LOGDAYS_DESC="Searches older than this are deleted, so the log does not hold what visitors typed for longer than needed. The dashboard can only look back this far."
COM_AISEARCH_CONFIG_PROTECTION="Protection"
COM_AISEARCH_CONFIG_RLSEARCH="Searches per minute for one visitor"
COM_AISEARCH_CONFIG_RLSEARCH_DESC="A visitor who searches faster than this sees a short 'please wait' notice instead of results (a person rarely searches more than a few times a minute). 0 turns the limit off."
COM_AISEARCH_CONFIG_IPHDR="Header with the real visitor address"
COM_AISEARCH_CONFIG_IPHDR_DESC="Leave empty unless the site is behind a proxy such as Cloudflare, then enter the server variable it sets, for example HTTP_CF_CONNECTING_IP. Only set this for a proxy you control: the value is trusted as given."
COM_AISEARCH_CONFIG_EXCLCATS="Categories left out of search"
COM_AISEARCH_CONFIG_EXCLCATS_DESC="Articles in these categories never appear in results or suggestions. Use it for pages that are not content, such as Uncategorised pages, Policy, contact or thank-you pages. The exclusion is checked at search time, so it takes effect at once."
COM_AISEARCH_CONFIG_EXCLIDS="Articles left out of search"
COM_AISEARCH_CONFIG_EXCLIDS_DESC="Article numbers (the ID column in Articles), separated by commas, that never appear in results, for example the Homepage article."
COM_AISEARCH_CONFIG_SHORTQ="Searches of one word"
COM_AISEARCH_CONFIG_SHORTQ_DESC="A search of one word (for example, breast milk) is too short to say what the visitor wants, so an article that only mentions the word is noise. With this on, such a search shows the articles whose title has the word, then those whose title has a synonym of it, and nothing else. If no title has the word, the normal search runs."
COM_AISEARCH_SHORTQ_0="Off: normal search"
COM_AISEARCH_SHORTQ_1="Title only, newest first"
COM_AISEARCH_SHORTQ_2="Title only, most read first"
COM_AISEARCH_CONFIG_SHORTEX="Compounds that do not count as their short word"
COM_AISEARCH_CONFIG_SHORTEX_DESC="Thai word splitting cuts some compounds in two, so a short word such as ยา (medicine) is also 'found' in น้ำยา (cleaning liquid, curry sauce). List such compounds here, separated by commas, and they no longer count as the short word."
